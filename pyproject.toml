[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiprofile"
version = "0.1.0"
description = "Bayesian fitting of global HI line profiles (Stewart et al. 2014 model) with nested sampling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lars Flöer" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "h5py>=3.9",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "nautilus-sampler>=1.0",
    "numba>=0.59",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
gpu = ["jax[cuda12]>=0.4.30"]
samplers = ["dynesty>=2.1", "ultranest>=4.0"]
plots = ["matplotlib>=3.8"]
parquet = ["pyarrow>=14"]
all = ["hiprofile[jax,samplers,plots,parquet]"]
dev = ["hiprofile[all]", "pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "mkdocs-material>=9"]

[project.scripts]
hiprofile = "hiprofile.cli:main"

[project.urls]
Homepage = "https://github.com/lfloeer/hiprofile"

[tool.setuptools.packages.find]
include = ["hiprofile*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E741", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["hiprofile"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"hiprofile/plots/report.py" = ["E501"]  # embedded CSS/HTML
"benchmarks/*" = ["B023", "RUF001"]  # lambdas called inside the loop; Greek letters in labels
"docs/*" = ["RUF001", "RUF007"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (nested sampling, validation)",
    "legacy: needs the compiled legacy Cython code",
]
addopts = "-m 'not slow'"
